<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertNow | Send Instant Phone Alert</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container glass">
        <header>
            <div class="logo"><i class="fas fa-bell"></i> AlertNow</div>
            <p class="tagline">Bypass silence. Reach them instantly.</p>
        </header>

        <main>
            <!-- Step 1: Verify ID -->
            <div id="step-verify">
                <div class="form-group">
                    <label for="alert-id">Target Alert ID</label>
                    <div class="input-with-action">
                        <input type="text" id="alert-id" placeholder="e.g. FIRE-2947" autocomplete="off">
                        <button class="btn btn-primary btn-verify" onclick="verifyId()">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                    <div id="verify-status"></div>
                </div>
            </div>

            <!-- Step 2: Send Message (Hidden initially) -->
            <div id="step-message" style="display: none; animation: fadeIn 0.5s ease-out;">
                <div class="form-group">
                    <label>Recipient</label>
                    <div id="recipient-name" style="font-weight: 600; color: var(--primary); margin-bottom: 1rem;"></div>
                    
                    <label for="alert-msg">Emergency Message</label>
                    <textarea id="alert-msg" rows="4" placeholder="Wake up! It's urgent."></textarea>
                </div>
                <button class="btn btn-danger" onclick="sendAlert()" id="send-btn">
                    <i class="fas fa-bolt"></i> SEND LOUD ALERT
                </button>
                <p style="text-align: center; margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted);">
                    <i class="fas fa-info-circle"></i> This will play a loud sound even if their phone is on silent.
                </p>
            </div>
        </main>

        <footer style="margin-top: 2rem; text-align: center; border-top: 1px solid var(--border); padding-top: 1.5rem;">

            <!-- Download APK Banner -->
            <div style="background: linear-gradient(135deg, #1a1a1a, #111); border: 1px solid #FF2D2D33; border-radius: 12px; padding: 1.2rem 1.5rem; margin-bottom: 1.5rem;">
                <p style="font-size: 0.8rem; color: #666; margin: 0 0 0.75rem 0; text-transform: uppercase; letter-spacing: 0.1em;">
                    📱 Don't have the app yet?
                </p>
                <a id="download-apk-btn"
                   href="https://github.com/satishacharya03/alert-app/releases/download/download/Alertnow.apk"
                   download
                   style="display: inline-flex; align-items: center; gap: 0.6rem;
                          background: #FF2D2D; color: #fff; text-decoration: none;
                          padding: 0.75rem 1.5rem; border-radius: 8px;
                          font-weight: 700; font-size: 0.95rem; letter-spacing: 0.03em;
                          transition: background 0.2s, transform 0.15s;">
                    <i class="fas fa-download"></i>
                    Download AlertNow APK
                </a>
                <p style="font-size: 0.72rem; color: #444; margin: 0.6rem 0 0 0;">
                    Android 8.0+ required &nbsp;·&nbsp; Allow "Install unknown apps" when prompted
                </p>
            </div>

            <a href="admin.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">
                <i class="fas fa-lock"></i> Admin Panel
            </a>
        </footer>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <!-- Config loaded from .env via config.js — DO NOT hardcode secrets in app.js -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
